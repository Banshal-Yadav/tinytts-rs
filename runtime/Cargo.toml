[package]
name = "tinytts-rs"
version = "0.1.0"
edition = "2021"
description = "A from-scratch ONNX runtime specialized for one small int8 text-to-speech model"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Banshal-Yadav/tinytts-rs"
readme = "../README.md"
keywords = ["onnx", "tts", "inference", "simd"]
categories = ["multimedia::audio"]
exclude = ["../golden*", "../*.onnx"]

[lib]
name = "tinytts"
path = "src/lib.rs"

[[bin]]
name = "tinytts"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
